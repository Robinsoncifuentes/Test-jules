<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section id="home" class="hero">
        <h1>Welcome to Our Landing Page</h1>
        <p>This is a brief description of what we do.</p>
        <div class="hero-images">
            <img src="https://placekitten.com/g/300/200" alt="A cute kitten looking curious.">
            <img src="https://placekitten.com/g/301/200" alt="Another cute kitten playing.">
        </div>
    </section>

    <section id="about" class="about">
        <h2>About Us</h2>
        <p>Information about the company or project.</p>
    </section>

    <section id="contact" class="contact">
        <h2>Contact Us</h2>
        <form action="#" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2024 Landing Page. All rights reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
